[package]
name = "project-control-center"
description = "Project Control Center: orchestrate Claude Code agents on your projects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "ProjectControlCenter"

[[bin]]
name = "ProjectControlCenter"
path = "src/main.rs"

[lib]
name = "pcc_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pcc-core.workspace = true
pcc-store.workspace = true
pcc-claude.workspace = true
pcc-git.workspace = true
pcc-connections.workspace = true
pcc-orchestrator.workspace = true
pcc-pty.workspace = true
pcc-world.workspace = true
pcc-recovery.workspace = true
pcc-ai.workspace = true
pcc-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
