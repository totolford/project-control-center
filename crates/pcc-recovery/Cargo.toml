[package]
name = "pcc-recovery"
description = "Process registry, watchdog diagnosis, mission checkpoints, orphan detection and crash reports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pcc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
